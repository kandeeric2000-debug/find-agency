name: Competitor analysis batches

on:
  workflow_dispatch:
    inputs:
      batch_file:
        description: "Path in the repo to a batch file (JSON or CSV, up to 100 batches)"
        required: true
        default: "batches/houston-st-petersburg.json"
      only:
        description: "Optional comma-separated batch slugs to run (e.g. houston-web-design-usa). Empty = all"
        required: false
        default: ""
      app_url:
        description: "Published app URL (overrides the APP_URL repository variable)"
        required: false
        default: ""
  # Unattended trigger: any commit to main that changes files under batches/
  # runs the default batch file (or the AUTO_BATCH_FILE repository variable).
  push:
    branches: [main]
    paths:
      - "batches/**"

concurrency:
  group: competitor-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pick batch file
        id: pick
        run: |
          f="${{ inputs.batch_file }}"
          if [ -z "$f" ] && [ "${{ github.event_name }}" = "push" ]; then
            f=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'batches/*.json' 'batches/*.csv' 2>/dev/null | tail -n1 || true)
          fi
          [ -z "$f" ] && f="${{ vars.AUTO_BATCH_FILE || 'batches/houston-st-petersburg.json' }}"
          echo "Using $f"; echo "file=$f" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
      - name: Run batches
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL || 'https://find-agency.lovable.app' }}
          BATCH_RUNNER_TOKEN: ${{ secrets.BATCH_RUNNER_TOKEN }}
          BATCH_FILE: ${{ steps.pick.outputs.file }}
          ONLY: ${{ inputs.only }}
          OUT_DIR: out
        run: bun scripts/run-batches.ts
      - name: Zip results
        if: always()
        run: |
          if [ -d out ]; then cd out && zip -r ../competitor-results.zip . ; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-results
          path: |
            out/
            competitor-results.zip
          if-no-files-found: warn
